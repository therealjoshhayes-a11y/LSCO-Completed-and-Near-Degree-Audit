[project]
name = "lsco-credential-audit"
version = "0.1.0"
description = "Catalog-driven credential completion audit engine for LSCO."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
